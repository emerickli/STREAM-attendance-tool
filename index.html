<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0624" />
    <title>STREAM Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=16" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <button class="gear" id="settingsBtn" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"
            />
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
              d="M19.4 13a7.6 7.6 0 0 0 .1-2l2-1.5-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L15 3.1h-6l-.4 2.9a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5a7.6 7.6 0 0 0 .1 2l-2 1.5 2 3.4 2.4-1a7.7 7.7 0 0 0 1.7 1l.4 2.9h6l.4-2.9a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5z"
            />
          </svg>
        </button>
        <div class="event-shell">
          <select class="event-select" id="eventSelect" aria-label="Event"></select>
        </div>
      </header>
      <main class="stage">
        <div class="camera-frame" id="cameraFrame">
          <div id="reader"></div>
          <div class="viewfinder" aria-hidden="true">
            <div class="viewfinder-box">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
          <div class="debug-bar" id="debugBar" hidden>
            <button type="button" id="debugOk">106902</button>
            <button type="button" id="debugBad">000000</button>
          </div>
        </div>
      </main>
    </div>

    <div class="settings-panel" id="settingsPanel" hidden>
      <p class="create-title">Settings</p>
      <label class="setting-row">
        <span>Debug scans</span>
        <input type="checkbox" id="debugToggle" />
      </label>
      <button class="create-cancel" id="settingsClose" type="button">Close</button>
    </div>

    <div class="create-panel" id="createPanel" hidden>
      <p class="create-title">New event</p>
      <input
        class="create-input"
        id="createEventName"
        type="text"
        maxlength="80"
        placeholder="Event name"
        autocomplete="off"
      />
      <button class="create-save" id="createEventSave" type="button">Create</button>
      <button class="create-cancel" id="createEventCancel" type="button">Cancel</button>
    </div>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay-copy">
        <div class="wait-mark" aria-hidden="true"></div>
        <p class="overlay-title" id="overlayTitle"></p>
        <p class="overlay-detail" id="overlayDetail"></p>
      </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="js/config.js?v=9"></script>
    <script src="js/members.js?v=23"></script>
    <script src="js/app.js?v=24"></script>
  </body>
</html>
